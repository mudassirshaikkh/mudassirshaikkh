# OPTIONAL — richer stats image, rendered by GitHub itself (no third-party uptime risk).
# Setup: create a classic PAT with `public_repo` scope, save it as repo secret METRICS_TOKEN.
# Then embed in README:  <img src="https://raw.githubusercontent.com/mudassirshaikkh/mudassirshaikkh/main/github-metrics.svg">
name: Generate Metrics

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mudassirshaikkh
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
